<section class="reactive-enrollment-form">
  <h2>Enrollment Request (Reactive)</h2>

  <form [formGroup]="enrollForm" (ngSubmit)="onSubmit()">
    <div class="field">
      <label for="studentName">Student Name</label>
      <input id="studentName" formControlName="studentName" type="text" />
    </div>

    <div class="field">
      <label for="studentEmail">Student Email</label>
      <input id="studentEmail" formControlName="studentEmail" type="email" />
      <span class="error" *ngIf="enrollForm.get('studentEmail')?.errors?.['emailTaken']">
        This email is already registered.
      </span>
    </div>

    <div class="field">
      <label for="courseId">Course ID</label>
      <input id="courseId" formControlName="courseId" type="text" />
      <span class="error" *ngIf="enrollForm.get('courseId')?.errors?.['noCourseCode']">
        Course code starting with XX is not allowed.
      </span>
    </div>

    <div class="field">
      <label for="preferredSemester">Preferred Semester</label>
      <select id="preferredSemester" formControlName="preferredSemester">
        <option value="Odd">Odd</option>
        <option value="Even">Even</option>
      </select>
    </div>

    <div class="field checkbox-field">
      <label>
        <input type="checkbox" formControlName="agreeToTerms" />
        I agree to the terms
      </label>
    </div>

    <div class="field" formArrayName="additionalCourses">
      <label>Additional Courses</label>
      <div *ngFor="let ctrl of additionalCourses.controls; let i = index" class="dynamic-row">
        <input [formControlName]="i" type="text" />
        <button type="button" (click)="removeCourse(i)">Remove</button>
      </div>
      <button type="button" (click)="addCourse()">Add Another Course</button>
    </div>

    <button type="submit" [disabled]="enrollForm.invalid">Submit</button>
  </form>
</section>
