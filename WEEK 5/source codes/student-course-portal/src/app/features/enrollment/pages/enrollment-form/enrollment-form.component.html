<section class="enrollment-form">
  <h2>Enrollment Request (Template-Driven)</h2>

  <form #enrollForm="ngForm" (ngSubmit)="onSubmit(enrollForm)">
    <div class="field">
      <label for="studentName">Student Name</label>
      <input
        id="studentName"
        name="studentName"
        type="text"
        required
        minlength="3"
        [(ngModel)]="studentName"
        #nameCtrl="ngModel"
      />
      <span class="error" *ngIf="nameCtrl.touched && nameCtrl.errors?.['required']">Name is required</span>
      <span class="error" *ngIf="nameCtrl.touched && nameCtrl.errors?.['minlength']">
        Name must be at least 3 characters
      </span>
    </div>

    <div class="field">
      <label for="studentEmail">Student Email</label>
      <input
        id="studentEmail"
        name="studentEmail"
        type="email"
        required
        email
        [(ngModel)]="studentEmail"
        #emailCtrl="ngModel"
      />
      <span class="error" *ngIf="emailCtrl.touched && emailCtrl.errors?.['required']">Email is required</span>
      <span class="error" *ngIf="emailCtrl.touched && emailCtrl.errors?.['email']">Enter a valid email</span>
    </div>

    <div class="field">
      <label for="courseId">Course ID</label>
      <input id="courseId" name="courseId" type="number" required [(ngModel)]="courseId" #courseIdCtrl="ngModel" />
      <span class="error" *ngIf="courseIdCtrl.touched && courseIdCtrl.errors?.['required']">
        Course ID is required
      </span>
    </div>

    <div class="field">
      <label for="preferredSemester">Preferred Semester</label>
      <select id="preferredSemester" name="preferredSemester" [(ngModel)]="preferredSemester">
        <option value="Odd">Odd</option>
        <option value="Even">Even</option>
      </select>
    </div>

    <div class="field checkbox-field">
      <label>
        <input type="checkbox" name="agreeToTerms" required [(ngModel)]="agreeToTerms" #termsCtrl="ngModel" />
        I agree to the terms
      </label>
      <span class="error" *ngIf="termsCtrl.touched && termsCtrl.errors?.['required']">
        You must agree to the terms
      </span>
    </div>

    <button type="submit" [disabled]="enrollForm.invalid">Submit</button>
    <button type="button" (click)="enrollForm.resetForm()">Reset</button>

    <div class="success" *ngIf="submitted">Enrollment request submitted successfully!</div>
  </form>
</section>
